<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" fill="none">
  <defs>
    <!-- Soft fade mask so the stone carving dissolves seamlessly into GitHub's background -->
    <radialGradient id="fadeMaskGrad" cx="82%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <mask id="carvingMask">
      <rect width="880" height="190" fill="url(#fadeMaskGrad)"/>
    </mask>

    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#52525B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3F3F46" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#27272A" stop-opacity="0"/>
    </linearGradient>

    <!-- Minimalist Hairline Carved Lotus Petal -->
    <g id="minimalPetal">
      <path d="M 0,-16 C 10,-48 18,-78 0,-108 C -18,-78 -10,-48 0,-16 Z" stroke="#52525B" stroke-width="1" fill="none"/>
      <path d="M 0,-26 C 5,-50 9,-72 0,-94 C -9,-72 -5,-50 0,-26 Z" stroke="#3F3F46" stroke-width="0.75" fill="none"/>
    </g>

    <!-- Inner Hairline Petal -->
    <g id="innerMinimalPetal">
      <path d="M 0,-10 C 7,-30 12,-50 0,-68 C -12,-50 -7,-30 0,-10 Z" stroke="#71717A" stroke-width="0.9" fill="none"/>
    </g>

    <!-- Minimalist Carved Stone Flower Node -->
    <g id="carvedFlower">
      <circle cx="0" cy="0" r="10" stroke="#3F3F46" stroke-width="0.8"/>
      <path d="M 0,-9 C 2.5,-3 2.5,-3 9,0 C 2.5,3 2.5,3 0,9 C -2.5,3 -2.5,3 -9,0 C -2.5,-3 -2.5,-3 0,-9 Z" stroke="#52525B" stroke-width="0.9" fill="none"/>
      <circle cx="0" cy="0" r="1.5" fill="#71717A"/>
    </g>
  </defs>

  <!-- ======================================================================= -->
  <!-- BACKGROUND STONE ETCHING (RIGHT SIDE, MASKED & SUBTLE)                  -->
  <!-- ======================================================================= -->
  <g mask="url(#carvingMask)">
    <!-- Subtle Temple Grid / Architectural Guidelines -->
    <line x1="480" y1="0" x2="480" y2="190" stroke="#27272A" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="720" y1="0" x2="720" y2="190" stroke="#27272A" stroke-width="0.75" stroke-dasharray="3 3"/>
    <line x1="420" y1="95" x2="880" y2="95" stroke="#27272A" stroke-width="0.75" stroke-dasharray="3 3"/>

    <!-- Minimalist Scrolling Stone Floral Vine (Left of Mandala) -->
    <path d="M 450,95 C 485,45 535,45 570,95 C 605,145 655,145 690,95" stroke="#3F3F46" stroke-width="1.1" fill="none"/>
    <path d="M 472,72 C 482,52 508,56 502,76 C 498,86 484,84 486,74" stroke="#3F3F46" stroke-width="0.85" fill="none"/>
    <path d="M 592,118 C 602,138 628,134 622,114 C 618,104 604,106 606,116" stroke="#3F3F46" stroke-width="0.85" fill="none"/>
    <use href="#carvedFlower" x="512" y="82"/>
    <use href="#carvedFlower" x="632" y="108"/>

    <!-- Slow-Rotating Etched Stone Lotus Relief at (720, 95) -->
    <g transform="translate(720, 95)">
      <circle cx="0" cy="0" r="112" stroke="#27272A" stroke-width="1"/>
      <circle cx="0" cy="0" r="108" stroke="#3F3F46" stroke-width="0.75" stroke-dasharray="4 4"/>
      <circle cx="0" cy="0" r="70" stroke="#27272A" stroke-width="0.75"/>

      <!-- Outer 12-Petal Etched Ring -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="120s" repeatCount="indefinite"/>
        <use href="#minimalPetal" transform="rotate(0)"/>
        <use href="#minimalPetal" transform="rotate(30)"/>
        <use href="#minimalPetal" transform="rotate(60)"/>
        <use href="#minimalPetal" transform="rotate(90)"/>
        <use href="#minimalPetal" transform="rotate(120)"/>
        <use href="#minimalPetal" transform="rotate(150)"/>
        <use href="#minimalPetal" transform="rotate(180)"/>
        <use href="#minimalPetal" transform="rotate(210)"/>
        <use href="#minimalPetal" transform="rotate(240)"/>
        <use href="#minimalPetal" transform="rotate(270)"/>
        <use href="#minimalPetal" transform="rotate(300)"/>
        <use href="#minimalPetal" transform="rotate(330)"/>
      </g>

      <!-- Inner Counter-Rotating 8-Petal Ring -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="80s" repeatCount="indefinite"/>
        <use href="#innerMinimalPetal" transform="rotate(0)"/>
        <use href="#innerMinimalPetal" transform="rotate(45)"/>
        <use href="#innerMinimalPetal" transform="rotate(90)"/>
        <use href="#innerMinimalPetal" transform="rotate(135)"/>
        <use href="#innerMinimalPetal" transform="rotate(180)"/>
        <use href="#innerMinimalPetal" transform="rotate(225)"/>
        <use href="#innerMinimalPetal" transform="rotate(270)"/>
        <use href="#innerMinimalPetal" transform="rotate(315)"/>
      </g>

      <!-- Center Carved Seed Node -->
      <circle cx="0" cy="0" r="10" stroke="#52525B" stroke-width="1" fill="none"/>
      <circle cx="0" cy="0" r="3" fill="#71717A"/>
    </g>
  </g>

  <!-- ======================================================================= -->
  <!-- FOREGROUND: CLEAN ARCHITECTURAL TYPOGRAPHY (LEFT-ALIGNED)               -->
  <!-- ======================================================================= -->
  <!-- Subtle Top Coordinate / Index -->
  <text x="4" y="38" fill="#71717A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.5">
    00 // SOFTWARE ARCHITECTURE &amp; SYSTEMS
  </text>

  <!-- Name -->
  <text x="4" y="84" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5">
    Yashwant Gawande
  </text>

  <!-- Core Philosophy Subtitle -->
  <text x="4" y="114" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Building calm, scalable interfaces backed by resilient Go &amp; Python engines.
  </text>

  <!-- Minimal Etched Horizon Line with Carved Lotus Accent -->
  <g transform="translate(4, 142)">
    <line x1="0" y1="0" x2="620" y2="0" stroke="url(#lineFade)" stroke-width="1"/>
    <!-- Small carved stone diamond/lotus mark at start -->
    <polygon points="0,-4 4,0 0,4 -4,0" fill="#71717A"/>
    <circle cx="14" cy="0" r="1.5" fill="#52525B"/>
    <!-- Subtle traveling pulse along the etched line -->
    <circle cx="0" cy="0" r="2" fill="#A1A1AA">
      <animate attributeName="cx" values="14;420;14" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Stack Summary Caption -->
  <text x="4" y="170" fill="#71717A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="0.5">
    React · Next.js · TypeScript · Go · Python · Django · PostgreSQL · Docker · AWS
  </text>
</svg>
